<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match nodejs.app>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix nodejs-logs
  logstash_dateformat %Y.%m.%d
  <buffer>
    flush_interval 1s
  </buffer>
</match>

<match **>
  @type stdout
</match>