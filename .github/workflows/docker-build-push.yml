name: Build and Push Docker Image

"on":
  push:
    branches:
      - main
    paths:
      - 'Final-project/app/**'
      - 'Final-project/Dockerfile'
      - 'Final-project/k8s/**'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Final-project
          file: ./Final-project/Dockerfile
          push: true
          tags: |
            uacomedian/devops-app:latest
            uacomedian/devops-app:${{ github.sha }}

      - name: Update image tag in k8s manifest
        run: |
          sed -i "s|uacomedian/devops-app:.*|uacomedian/devops-app:${{ github.sha }}|g" \
            Final-project/k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Final-project/k8s/deployment.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes"
          git push